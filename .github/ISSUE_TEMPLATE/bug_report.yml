name: Bug report
description: Something in LayerShop did not work, including a setup or AI generation problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying LayerShop. It is a preview, and reports like this are how it gets better.
        Setup and AI problems depend on your hardware, so the details below matter most.
        Search the existing issues first, and please do not paste API keys or Hugging Face tokens.
  - type: input
    id: version
    attributes:
      label: LayerShop version
      description: Help › About, or the installer's file name (for example 0.10.0 Preview 1).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - MSI installer
        - Portable zip
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example Windows 11 23H2, or Windows 10 22H2.
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card and memory
      description: For example NVIDIA RTX 3060, 12 GB. Write "none" or the integrated GPU if you have no dedicated card. Add your driver version if you know it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it go wrong?
      options:
        - Setup wizard (checking my PC, install or model download)
        - Starting ComfyUI
        - AI Gen (Create, Edit, Restyle or references)
        - Model manager or Preferences › Generative AI
        - Cloud models (API key, cost)
        - The editor (tools, layers, filters, files)
        - Installer or update
        - Something else
    validations:
      required: true
  - type: dropdown
    id: comfyui
    attributes:
      label: Which ComfyUI are you using?
      options:
        - The private copy the setup wizard installed
        - My own ComfyUI (Desktop or portable)
        - No local ComfyUI (cloud models only)
        - Not sure
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce, in order. If you were generating, say which model and what you did (select, prompt, etc.).
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error text
      description: |
        Copy any error message in full. The setup wizard shows its whole error so you can copy it,
        and **What's happening?** shows the engine's own output.
        If ComfyUI failed to start, the end of `comfyui.log` helps: it is in LayerShop's settings folder
        (`%APPDATA%\LayerShop`, or `LayerShopData` beside `photocraft.exe` for the portable build).
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images here. Please do not attach files you do not have the right to share.
